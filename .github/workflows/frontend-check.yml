name: Frontend Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
     - cron: "0 2,13 * * *"
       timezone: "Europe/Moscow"
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lighthouse_schedule:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run lighthouse
        run: |
          npx lighthouse https://ctclove.ru/ \
            --output=json \
            --output-path=./lighthouse-report.json \
            --chrome-flags="--headless=new"
      - name: Run opencode review
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode-go/glm-5.2
          prompt: |
            Read ./lighthouse-report.json and extract LCP, CLS, INP, FCP, TBT.
            Compare them with docs/performance-baseline.md.
            If the baseline file is missing, create it with the current measured values and stop.
            For any metric that degraded by more than 10% versus the baseline,
            identify likely culprits in recent commits and create a GitHub issue
            with specific recommendations.
